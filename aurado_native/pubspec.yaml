name: aurado
description: "Aurado Student — The Multi-Platform EdTech Super App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── Core UI ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  shared_preferences: ^2.5.2

  # ── State Management & DI ─────────────────────────────────
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  get_it: ^8.0.3

  # ── Navigation ───────────────────────────────────────────
  go_router: ^14.8.1

  # ── Backend ──────────────────────────────────────────────
  supabase_flutter: ^2.8.1

  # ── Security & Storage ───────────────────────────────────
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  crypto: ^3.0.6
  local_auth: ^2.3.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.1
  sqlite3: ^2.5.0
  workmanager: ^0.9.0
  encrypt: ^5.0.3

  # ── Media & Player ────────────────────────────────────────
  pod_player: ^0.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # ── Networking & Utils ────────────────────────────────────
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  permission_handler: ^11.4.0
  hugeicons: ^1.1.5
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.3
  drift_dev: ^2.20.2
  freezed: ^3.0.0
  json_serializable: ^6.9.1

flutter:
  uses-material-design: true
  assets:
    - .env
